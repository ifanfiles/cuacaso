<!doctype html> 
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <title>Peta Prakiraan Cuaca per Kecamatan</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    #map { height: 86vh; }
    .controls { padding:8px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,0.3); display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    /*.legend { background:#fff; padding:8px; line-height:1.6; }
    .legend .item { display:flex; align-items:center; gap:8px; }
    .colorbox { width:18px; height:14px; display:inline-block; border:0.5px solid #999; }*/
    .legend {
  background: #fff;
  padding: 6px;
  font-size: 12px;
  text-align: center;
  width: 480px;
}

.legend-bar {
  display: grid;
  grid-template-columns: repeat(6, 1fr); /* jumlah kategori */
  height: 20px;
  border: 1px solid #999;
  margin-bottom: 4px;
}

.legend-bar div {
  height: 100%;
}

.legend-labels-angka {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  justify-content: space-between;
  font-size: 11px;
}
.legend-labels {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  font-size: 11px;
}

    .timestamp-overlay {
      position:absolute;
      bottom: 10px;   /* pindahkan ke bawah */
      left: 50%;      /* posisikan di tengah horizontal */
      transform: translateX(-50%); /* geser ke kiri separuh lebarnya supaya benar2 center */
      background:rgba(255,255,255,0.9);
      padding:6px 12px;
      border-radius:4px;
      font-size:25px;
      font-weight:bold;
      z-index:1000;
    }
    .kab-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-size: 14px;
      font-weight: bold;
      color: black;
      text-shadow: 1px 1px 2px white;
    }
  </style>
</head>
<body>
  <div class="controls">
    <label>Waktu: <select id="timeSelect"></select></label>
    <button id="prevBtn">◀ Prev</button>
    <button id="playBtn">▶ Play</button>
    <button id="pauseBtn" disabled>⏸ Pause</button>
    <button id="nextBtn">Next ▶</button>
    <label>Kecepatan:
      <select id="speedSelect">
        <option value="1000">1 detik</option>
        <option value="2000" selected>2 detik</option>
        <option value="5000">5 detik</option>
      </select>
    </label>
  </div>

  <div id="map"></div>
  <div id="legend" class="legend" style="position: absolute; right: 10px; bottom: 10px; z-index:1000;"></div>
  <div id="timestamp" class="timestamp-overlay">-</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  const categoryColors = {
    "Cerah": "#ffffff",
    "Cerah Berawan": "#d9f0ff",
    "Berawan": "#a0c4ff",
    "Hujan Ringan": "#7be57b",
    "Hujan Sedang": "#ffd84d",
    "Hujan Lebat": "#ff9a2e",
    "Hujan Sangat Lebat": "#ff4d4d",
    "Ekstrem": "#b84dff"
  };

  const GEOJSON_FILE = "Batas_SO_kec.json";
  const FORECAST_FILE = "prakiraan_per_kecamatan.json";

  let map = L.map('map').setView([-7.5, 110.2], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OSM'
  }).addTo(map);

  let geojsonLayer;
  let forecastData = null;
  let timestamps = [];
  let playInterval = null;
  let currentIndex = 0;
  let playSpeed = 2000;
  let iconLayer; // <<== tambahkan untuk ikon

  Promise.all([
    fetch(FORECAST_FILE).then(r => r.json()),
    fetch(GEOJSON_FILE).then(r => r.json())
  ]).then(([forecast, geojson]) => {
    forecastData = forecast;

    const tsSet = new Set();
    Object.values(forecastData).forEach(perKec=>{
      Object.keys(perKec).forEach(t=> tsSet.add(t));
    });
    timestamps = Array.from(tsSet).sort((a,b)=> new Date(a) - new Date(b));

    const timeSelect = document.getElementById('timeSelect');
    if(timestamps.length === 0){
      alert('Tidak ada slot waktu di data prakiraan.');
      return;
    }
    timestamps.forEach(t=>{
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      timeSelect.appendChild(opt);
    });

    currentIndex = 0;
    addGeojsonLayer(geojson, timestamps[currentIndex]);

    fetch('Batas_SO_Kab.json').then(r=>r.json()).then(kabGeo=>{
      let kabupatenLayer = L.geoJson(kabGeo, {
        style: { color: "black", weight: 2.5, fillOpacity: 0 },
        onEachFeature: function(feature, layer){
          if(feature.properties && feature.properties.WADMKK){
            layer.bindTooltip(feature.properties.WADMKK, {
              permanent: true,
              direction: "center",
              className: "kab-label"
            });
          }
        }
      }).addTo(map);
      kabupatenLayer.bringToFront();
    });

    timeSelect.addEventListener('change', e=>{
      const val = e.target.value;
      currentIndex = timestamps.indexOf(val);
      updateChoropleth(val);
    });
    document.getElementById('playBtn').addEventListener('click', startPlay);
    document.getElementById('pauseBtn').addEventListener('click', stopPlay);
    document.getElementById('prevBtn').addEventListener('click', ()=>{
      stopPlay();
      currentIndex = (currentIndex - 1 + timestamps.length) % timestamps.length;
      updateChoropleth(timestamps[currentIndex]);
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      stopPlay();
      currentIndex = (currentIndex + 1) % timestamps.length;
      updateChoropleth(timestamps[currentIndex]);
    });
    document.getElementById('speedSelect').addEventListener('change', e=>{
      playSpeed = parseInt(e.target.value);
      if(playInterval){ stopPlay(); startPlay(); }
    });

    drawLegend();
  });

  function styleFeature(feature, timeKey){
    const kec = feature.properties.WADMKC;
    let cuaca = null;
    if(forecastData[kec] && forecastData[kec][timeKey]){
      cuaca = forecastData[kec][timeKey].cuaca;
    }
    const color = categoryColors[cuaca] || '#cccccc';
    return { color:'#444', weight:0.8, fillColor:color, fillOpacity:0.8 };
  }

  function onEachFeature(feature, layer){
    layer.on('click', ()=>{
      const kec = feature.properties.WADMKC;
      const t = document.getElementById('timeSelect').value;
      let html = `<strong>${kec}</strong><br/>`;
      if(forecastData[kec] && forecastData[kec][t]){
        const info = forecastData[kec][t];
        html += `Waktu: ${t}<br/>`;
        html += `Cuaca: ${info.cuaca}<br/>`;
        if(info.image){
          html += `<img src="${info.image}" alt="${info.cuaca}" width="48"/>`;
        }
      } else {
        html += 'Data prakiraan tidak tersedia.';
      }
      layer.bindPopup(html).openPopup();
    });
  }

  function addGeojsonLayer(geojson, timeKey){
    if(geojsonLayer) map.removeLayer(geojsonLayer);
    if(iconLayer) map.removeLayer(iconLayer);

    geojsonLayer = L.geoJson(geojson, {
      style: f=> styleFeature(f, timeKey),
      onEachFeature: onEachFeature
    }).addTo(map);

    // Tambahkan ikon prakiraan cuaca
    iconLayer = L.layerGroup();
    geojsonLayer.eachLayer(layer=>{
      const kec = layer.feature.properties.WADMKC;
      if(forecastData[kec] && forecastData[kec][timeKey]){
        const info = forecastData[kec][timeKey];
        if(info.image){
          const center = layer.getBounds().getCenter();
          const icon = L.divIcon({
            html: `<img src="${info.image}" style="width:22px;height:22px;">`,
            className: ""
          });
          L.marker(center, {icon}).addTo(iconLayer);
        }
      }
    });
    iconLayer.addTo(map);

    map.fitBounds(geojsonLayer.getBounds(), {padding:[20,20]});
    updateTimestamp(timeKey);
    document.getElementById('timeSelect').value = timeKey;
  }

  function updateChoropleth(timeKey){
    if(!geojsonLayer) return;
    geojsonLayer.eachLayer(layer=>{
      layer.setStyle(styleFeature(layer.feature, timeKey));
    });
/*
    // Update ikon prakiraan cuaca
    if(iconLayer) map.removeLayer(iconLayer);
    iconLayer = L.layerGroup();
    geojsonLayer.eachLayer(layer=>{
      const kec = layer.feature.properties.WADMKC;
      if(forecastData[kec] && forecastData[kec][timeKey]){
        const info = forecastData[kec][timeKey];
        if(info.image){
          const center = layer.getBounds().getCenter();
          const icon = L.divIcon({
            html: `<img src="${info.image}" style="width:22px;height:22px;">`,
            className: ""
          });
          L.marker(center, {icon}).addTo(iconLayer);
        }
      }
    });
    iconLayer.addTo(map);
*/
    document.getElementById('timeSelect').value = timeKey;
    updateTimestamp(timeKey);
  }

  function updateTimestamp(t){
    document.getElementById('timestamp').textContent = t || '-';
  }

/*  function drawLegend(){
    const legendDiv = document.getElementById('legend');
    legendDiv.innerHTML = '<strong>Legenda</strong><br/>';
    const order = ["Cerah","Cerah Berawan","Berawan","Hujan Ringan","Hujan Sedang","Hujan Lebat","Hujan Sangat Lebat","Ekstrem"];
    order.forEach(k=>{
      const col = categoryColors[k] || '#cccccc';
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `<span class="colorbox" style="background:${col}"></span> ${k}`;
      legendDiv.appendChild(item);
    });
  }*/
    function drawLegend(){
  const legendDiv = document.getElementById('legend');
  legendDiv.innerHTML = `
    <strong>Legenda Hujan (Reflektivitas dBZ)</strong><br/>
    <div class="legend-bar">
      <div style="background:#0000ff"></div> <!-- 5-15 -->
      <div style="background:#00ff00"></div> <!-- 20-30 -->
      <div style="background:#ffff00"></div> <!-- 35-40 -->
      <div style="background:#ff7f00"></div> <!-- 45-50 -->
      <div style="background:#ff0000"></div> <!-- 55-60 -->
      <div style="background:#ff00ff"></div> <!-- 65-70 -->
    </div>
    <div class="legend-labels-angka">
      <span>0</span>
      <span>5</span>
      <span>20</span>
      <span>35</span>
      <span>45</span>
      <span>55</span>
      <span>65</span>
    </div>
    <div class="legend-labels">
      <span>Sangat Ringan</span>
      <span>Ringan</span>
      <span>Sedang</span>
      <span>Lebat</span>
      <span>Sangat Lebat</span>
      <span>Ekstrem</span>
    </div>
  `;
}

  function startPlay(){
    if(playInterval) return;
    document.getElementById('playBtn').disabled = true;
    document.getElementById('pauseBtn').disabled = false;
    playInterval = setInterval(()=>{
      currentIndex = (currentIndex + 1) % timestamps.length;
      updateChoropleth(timestamps[currentIndex]);
    }, playSpeed);
  }

  function stopPlay(){
    clearInterval(playInterval);
    playInterval = null;
    document.getElementById('playBtn').disabled = false;
    document.getElementById('pauseBtn').disabled = true;
  }
  </script>
</body>
</html>
